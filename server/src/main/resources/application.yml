spring:
  application:
    name: lowcode-server
  datasource:
    url: ${DB_URL:jdbc:mysql://localhost:3306/lowcode?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai}
    username: ${DB_USERNAME:lowcode}
    password: ${DB_PASSWORD:lowcode}
  flyway:
    enabled: true
  jackson:
    default-property-inclusion: non_null

app:
  web:
    allowed-origins: ${WEB_ALLOWED_ORIGINS:http://localhost:5173,http://127.0.0.1:5173}
  jwt:
    secret: ${JWT_SECRET}
    access-token-ttl: PT15M
  auth:
    refresh-token-ttl: ${AUTH_REFRESH_TOKEN_TTL:P30D}
    cookie-secure: ${AUTH_COOKIE_SECURE:false}
  wechat:
    enabled: ${WECHAT_LOGIN_ENABLED:false}
    app-id: ${WECHAT_OPEN_APP_ID:}
    app-secret: ${WECHAT_OPEN_APP_SECRET:}
    redirect-uri: ${WECHAT_OPEN_REDIRECT_URI:}
    web-public-base-url: ${WEB_PUBLIC_BASE_URL:http://localhost:5173}
    state-ttl: PT5M
  minio:
    endpoint: ${MINIO_ENDPOINT:http://localhost:9000}
    access-key: ${MINIO_ACCESS_KEY:minioadmin}
    secret-key: ${MINIO_SECRET_KEY:minioadmin}
    bucket: ${MINIO_BUCKET:lowcode-assets}

management:
  endpoints:
    web:
      exposure:
        include: health,info
